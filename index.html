<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoGraph Academy</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            direction: rtl;
        }

        header {
            background-color: #111;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        main {
            padding: 40px 20px;
            text-align: center;
        }

        .course-box {
            background-color: #fff;
            margin: 20px auto;
            padding: 30px;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .course-box h2 {
            margin-bottom: 10px;
            color: #222;
        }

        .course-box p {
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background-color: #000;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            margin-top: 50px;
            background-color: #111;
            color: #fff;
            text-align: center;
            padding: 15px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>به آکادمی VideoGraph خوش آمدید</h1>
    </header>

    <main>
        <div class="course-box">
            <h2>دوره آموزش تدوین ویدیو</h2>
            <p>یاد بگیر چطور ویدیوهایی حرفه‌ای تدوین کنی و وارد دنیای درآمد از اینستاگرام بشی.</p>
            <a href="#" class="btn">خرید دوره (فعلاً از طریق دایرکت)</a>
        </div>
    </main>

    <footer>
        <p>تمامی حقوق محفوظ است - VideoGraph Academy &copy; 2025</p>
    </footer>
</body>
</html>
